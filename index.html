<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brickwake</title>
    <style>
      :root {
        --ink: #f3e9d6;
        --dim: rgba(243, 233, 214, 0.55);
        --gold: #e9b44c;
        --panel: rgba(10, 16, 20, 0.62);
        --edge: rgba(233, 180, 76, 0.28);
        font-family: "Iowan Old Style", "Palatino", Georgia, serif;
      }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1216; }
      canvas { display: block; width: 100%; height: 100%; }
      #status { display: none; }
      #overlay {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; cursor: pointer; color: var(--ink);
        background: radial-gradient(ellipse at 50% 55%, rgba(8, 12, 16, 0.15), rgba(8, 12, 16, 0.78));
      }
      #overlay[hidden] { display: none; }
      #overlay h1 { margin: 0; font-size: 72px; letter-spacing: 0.22em; font-weight: 600; color: var(--gold); text-shadow: 0 4px 30px rgba(0, 0, 0, 0.6); }
      #overlay .overlay-hint { font-size: 20px; letter-spacing: 0.3em; text-transform: uppercase; animation: breathe 2.4s ease-in-out infinite; }
      #overlay .overlay-keys { font: 13px/1.6 ui-sans-serif, system-ui, sans-serif; color: var(--dim); letter-spacing: 0.08em; }
      #overlay[data-state="connecting"] .overlay-hint::after, #overlay[data-state="joining"] .overlay-hint::after { content: " · raising anchor"; opacity: 0.6; }
      #overlay[data-state="closed"] .overlay-hint::after { content: " · connection lost"; color: #e36b4f; }
      @keyframes breathe { 50% { opacity: 0.55; } }

      #hud {
        position: fixed; left: 22px; bottom: 22px; display: flex; align-items: flex-end; gap: 10px;
        color: var(--ink); pointer-events: none; user-select: none; font-variant-numeric: tabular-nums;
      }
      #hud[hidden] { display: none; }
      .hud-panel {
        background: var(--panel); border: 1px solid var(--edge); border-radius: 10px; padding: 10px 14px;
        backdrop-filter: blur(6px); box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
      }
      .hud-label { font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
      .hud-key { font: 10px/1 ui-sans-serif, system-ui, sans-serif; color: var(--dim); margin-top: 8px; letter-spacing: 0.06em; }
      .hud-sail, .hud-rudder { width: 128px; }
      .hud-sail-levels { display: flex; flex-direction: column; gap: 3px; }
      .hud-sail-level {
        font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; color: var(--dim);
        transition: background 120ms, color 120ms;
      }
      .hud-sail-level.active { color: #1a1206; background: var(--gold); }
      .hud-meter { height: 4px; margin-top: 8px; background: rgba(243, 233, 214, 0.15); border-radius: 2px; overflow: hidden; }
      .hud-meter-fill { height: 100%; background: var(--ink); transform-origin: left; transform: scaleX(0); }
      .hud-nav { display: flex; flex-direction: column; align-items: center; padding: 12px 18px 10px; }
      .hud-compass { position: relative; width: 120px; height: 120px; }
      .hud-compass-ring {
        position: absolute; inset: 0; border-radius: 50%; border: 1px solid var(--edge);
        background: repeating-conic-gradient(from -1deg, rgba(243, 233, 214, 0.35) 0 2deg, transparent 2deg 30deg);
        -webkit-mask: radial-gradient(circle, transparent 50px, #000 51px); mask: radial-gradient(circle, transparent 50px, #000 51px);
      }
      .hud-compass-ship, .hud-compass-wind { position: absolute; inset: 0; transition: transform 60ms linear; }
      .hud-compass-ship::before {
        content: ""; position: absolute; left: 50%; top: 14px; width: 12px; height: 26px; margin-left: -6px;
        background: var(--ink); clip-path: polygon(50% 0, 100% 35%, 85% 100%, 15% 100%, 0 35%); opacity: 0.9;
      }
      .hud-compass-wind span {
        position: absolute; left: 50%; top: 50%; width: 0; height: 0; margin: -58px 0 0 -8px;
        border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 14px solid var(--gold);
        filter: drop-shadow(0 0 4px rgba(233, 180, 76, 0.6));
      }
      .hud-compass-wind span::after {
        content: ""; position: absolute; left: -1px; top: 14px; width: 2px; height: 92px;
        background: linear-gradient(rgba(233, 180, 76, 0.7), transparent 40%, transparent 60%, rgba(233, 180, 76, 0.25));
      }
      .hud-speed { position: absolute; inset: 0; display: flex; align-items: baseline; justify-content: center; padding-top: 44px; gap: 4px; }
      .hud-speed b { font-size: 30px; font-weight: 600; }
      .hud-speed small { font-size: 12px; color: var(--dim); letter-spacing: 0.1em; }
      .hud-point { margin-top: 6px; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); }
      .hud-wind { font-size: 12px; color: var(--dim); letter-spacing: 0.1em; }
      .hud-rudder-track { position: relative; height: 22px; margin-top: 4px; border-radius: 4px; background: linear-gradient(90deg, rgba(227, 107, 79, 0.25), rgba(243, 233, 214, 0.08) 45% 55%, rgba(110, 190, 120, 0.25)); }
      .hud-rudder-centre { position: absolute; left: 50%; top: 3px; bottom: 3px; width: 1px; background: var(--dim); }
      .hud-rudder-needle { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 4px; margin-left: -2px; border-radius: 2px; background: var(--gold); box-shadow: 0 0 6px rgba(233, 180, 76, 0.7); }
      .hud-rudder-sides { display: flex; justify-content: space-between; margin-top: 5px; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }

      #reticle {
        position: fixed; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px;
        pointer-events: none; user-select: none; color: var(--gold); --tone: var(--gold);
      }
      #reticle[hidden] { display: none; }
      #reticle[data-state="reloading"] { --tone: var(--ink); }
      #reticle[data-state="out-of-arc"], #reticle[data-state="out-of-range"], #reticle[data-state="no-aim"] { --tone: #e36b4f; }
      .reticle-ring, .reticle-hit { position: absolute; inset: 0; overflow: visible; filter: drop-shadow(0 0 3px rgba(0, 0, 0, 0.7)); }
      .reticle-track { fill: none; stroke: rgba(243, 233, 214, 0.22); stroke-width: 2; }
      .reticle-load { fill: none; stroke: var(--tone); stroke-width: 2.5; stroke-linecap: round; transition: stroke 120ms; }
      .reticle-ticks { stroke: var(--tone); stroke-width: 2; stroke-linecap: round; }
      .reticle-dot { fill: var(--tone); }
      .reticle-hit { opacity: 0; }
      .reticle-hit path { stroke: #fff4e0; stroke-width: 3.2; stroke-linecap: round; }
      .reticle-hit.show { animation: hitmark 420ms ease-out; }
      @keyframes hitmark { 0% { opacity: 1; transform: scale(1.35); } 30% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.1); } }
      .reticle-side, .reticle-status {
        position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap; font-variant-numeric: tabular-nums;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85); letter-spacing: 0.24em; text-transform: uppercase;
      }
      .reticle-side { top: -26px; font-size: 11px; color: var(--dim); }
      .reticle-status { top: 72px; font-size: 13px; color: var(--tone); }
      #reticle.denied { animation: deny 260ms ease-in-out; }
      @keyframes deny { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
      #match { position: fixed; inset: 0; pointer-events: none; user-select: none; color: var(--ink); font-variant-numeric: tabular-nums; }
      #match[hidden] { display: none; }
      #match[data-phase="ended"]::before { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, rgba(8, 12, 16, 0.15), rgba(8, 12, 16, 0.6)); }
      .mh-clock {
        position: absolute; top: 18px; left: 50%; transform: translateX(-50%); min-width: 150px; padding: 7px 22px 8px; text-align: center;
        background: var(--panel); border: 1px solid var(--edge); border-radius: 10px; backdrop-filter: blur(6px); box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
      }
      .mh-phase { font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--gold); }
      .mh-time { font-size: 30px; font-weight: 600; line-height: 1.15; letter-spacing: 0.04em; transition: color 200ms; }
      .mh-time[data-low="true"] { color: #e36b4f; }
      .mh-standing { font-size: 12px; letter-spacing: 0.12em; color: var(--dim); }
      .mh-standing:empty { display: none; }
      .mh-feed { position: absolute; top: 18px; right: 22px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
      .mh-feed-line {
        display: flex; align-items: baseline; gap: 9px; padding: 5px 13px; font-size: 15px; letter-spacing: 0.04em;
        background: var(--panel); border: 1px solid rgba(233, 180, 76, 0.14); border-radius: 6px; backdrop-filter: blur(6px);
        animation-name: feed; animation-timing-function: linear; animation-fill-mode: forwards;
      }
      .mh-feed-line[data-own="won"] { border-color: rgba(233, 180, 76, 0.5); }
      .mh-feed-line[data-own="lost"] { border-color: rgba(227, 107, 79, 0.55); }
      .mh-skull { color: var(--gold); font-size: 14px; opacity: 0.9; }
      .mh-feed-line[data-own="lost"] .mh-skull { color: #e36b4f; }
      .mh-you { color: var(--gold); font-weight: 600; }
      @keyframes feed { 0% { opacity: 0; transform: translateX(14px); } 4% { opacity: 1; transform: none; } 86% { opacity: 1; } 100% { opacity: 0; } }
      .mh-ship { position: absolute; right: 22px; bottom: 22px; width: 190px; }
      .mh-ship .hud-label { display: inline-block; }
      .mh-hull-value { float: right; margin-top: -3px; font-size: 20px; font-weight: 600; }
      .mh-hull { clear: both; height: 9px; border-radius: 3px; background: rgba(243, 233, 214, 0.12); overflow: hidden; }
      .mh-hull-fill { height: 100%; transform-origin: left; background: linear-gradient(90deg, #a87a2a, var(--gold)); transition: transform 250ms ease-out; }
      .mh-hull-fill[data-level="hurt"] { background: linear-gradient(90deg, #a24e24, #e0913f); }
      .mh-hull-fill[data-level="critical"] { background: linear-gradient(90deg, #7e2418, #e36b4f); animation: breathe 0.9s ease-in-out infinite; }
      .mh-guns-label { margin-top: 12px; }
      .mh-gun { display: flex; align-items: center; gap: 10px; margin-top: 4px; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
      .mh-gun span { width: 36px; }
      .mh-gun-bar { flex: 1; height: 5px; border-radius: 2px; background: rgba(243, 233, 214, 0.12); overflow: hidden; }
      .mh-gun-fill { height: 100%; transform-origin: left; background: var(--ink); opacity: 0.7; }
      .mh-gun-fill[data-ready="true"] { background: var(--gold); opacity: 1; box-shadow: 0 0 6px rgba(233, 180, 76, 0.7); }
      .mh-banner { position: absolute; left: 50%; top: 24%; transform: translateX(-50%); text-align: center; white-space: nowrap; text-shadow: 0 2px 18px rgba(0, 0, 0, 0.8), 0 1px 3px rgba(0, 0, 0, 0.9); }
      .mh-banner[hidden], #match:has(.mh-board:not([hidden])) .mh-banner { display: none; }
      .mh-banner-title { font-size: 40px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); }
      .mh-banner[data-tone="danger"] .mh-banner-title { color: #e36b4f; }
      .mh-banner-sub { margin-top: 8px; font-size: 14px; letter-spacing: 0.26em; text-transform: uppercase; }
      .mh-board {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); min-width: 440px; padding: 22px 30px 18px; text-align: center;
        background: rgba(10, 16, 20, 0.84); border: 1px solid var(--edge); border-radius: 12px; backdrop-filter: blur(10px); box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
      }
      .mh-board[hidden] { display: none; }
      .mh-board-verdict { font-size: 54px; font-weight: 600; letter-spacing: 0.2em; line-height: 1.1; text-transform: uppercase; color: var(--gold); text-shadow: 0 4px 30px rgba(233, 180, 76, 0.25); }
      .mh-board[data-verdict="defeat"] .mh-board-verdict { color: #e36b4f; text-shadow: 0 4px 30px rgba(227, 107, 79, 0.25); }
      .mh-board[data-verdict="draw"] .mh-board-verdict { color: var(--ink); }
      .mh-board[data-verdict="none"] .mh-board-verdict { display: none; }
      .mh-board-title { margin: 6px 0 14px; font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--gold); }
      .mh-board table { width: 100%; border-collapse: collapse; font-size: 17px; }
      .mh-board th { padding: 4px 10px; font-size: 10px; font-weight: normal; letter-spacing: 0.22em; text-transform: uppercase; color: var(--dim); text-align: right; }
      .mh-board td { padding: 7px 10px; text-align: right; border-top: 1px solid rgba(243, 233, 214, 0.08); }
      .mh-board td:first-child { color: var(--dim); width: 24px; }
      .mh-board .mh-name { text-align: left; }
      .mh-board tr.mh-own td { color: var(--gold); background: rgba(233, 180, 76, 0.08); }
      .mh-board-foot { margin-top: 16px; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); }

      #hits { position: fixed; left: 50%; top: 50%; width: 280px; height: 280px; margin: -140px 0 0 -140px; pointer-events: none; }
      .hitdir { position: absolute; inset: 0; opacity: 0; }
      .hitdir svg { width: 100%; height: 100%; overflow: visible; }
      .hitdir path { fill: rgba(232, 84, 58, 0.88); filter: drop-shadow(0 0 7px rgba(232, 84, 58, 0.85)); }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="hud" hidden></div>
    <div id="reticle" hidden></div>
    <div id="hits"></div>
    <div id="match" hidden></div>
    <div id="overlay" data-state="connecting">
      <h1>BRICKWAKE</h1>
      <div class="overlay-hint">Click to set sail</div>
      <div class="overlay-keys">W / S sail · A / D rudder · mouse to look and aim · click to fire · wheel to zoom · Tab scoreboard</div>
    </div>
    <div id="status"></div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
